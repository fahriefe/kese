<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kese - Gider Defteri</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='14' fill='%23ff8f6b'/><circle cx='24' cy='24' r='14' fill='none' stroke='%232a0f06' stroke-width='2.6'/><path d='M18.5 31v-5M24 31v-9M29.5 31v-13' stroke='%232a0f06' stroke-width='3.2' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1412;--panel:#10201c;--raised:#17302a;--line:rgba(230,242,238,.13);--tx:#e6f2ee;--mut:#93aea6;--ac:#ff8f6b;--on-ac:#2a0f06;--ok:#4fd1a1;--warn:#f2c14e;--bad:#ff7a7a;--r:20px;--r-sm:12px;--display:"Bricolage Grotesque",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;--mono:"Geist Mono",ui-monospace,monospace;color-scheme:dark}
.light{--panel:#eaf3ef;--raised:#dcebe5;--bg:#ffffff;--tx:#0e1f1b;--mut:#4d6a62;--line:#c6dcd3;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
::selection{background:#ff8f6b55}
body{margin:0;background:var(--bg);color:var(--tx);font:16.5px/1.55 Geist,system-ui,sans-serif;min-height:100vh;
background:radial-gradient(900px 520px at 78% -8%,rgba(255,143,107,.16),transparent 70%),linear-gradient(rgba(230,242,238,.035) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(230,242,238,.035) 1px,transparent 1px) 0 0/64px 64px,#0a1412;background-attachment:fixed}
main{max-width:1180px;margin:0 auto;padding:0 20px 72px}
h1,h2{font-family:var(--display);margin:0}
h1{font-size:clamp(36px,5vw,58px);font-weight:750;letter-spacing:-.045em;line-height:1}
h2{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-bottom:16px}
.kicker{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:0 0 10px}
.num,.stat b,td.n,.amt,.months div{font-variant-numeric:tabular-nums}
.logo{width:34px;height:34px;flex:none}
.brand{display:flex;gap:10px;align-items:center}
.name{font-family:var(--display);font-weight:750;font-size:20px;letter-spacing:-.03em;line-height:1.1}
.name small{display:none}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;color:var(--tx)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;min-height:44px;width:100%}
.panel:not(.light) input,.panel:not(.light) select,.panel:not(.light) textarea{background:var(--bg)}
textarea{resize:vertical}
select option{background:var(--panel);color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:2px solid var(--ac);outline-offset:1px}
input[type=color]{padding:3px;width:50px}
button{cursor:pointer;font-weight:600;width:auto;background:var(--raised);border-radius:999px;transition:background .15s,border-color .15s,transform .15s}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:700;width:100%}
button.p:hover{background:#ffa488;transform:translateY(-1px)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.x{background:transparent;color:var(--mut);padding:4px 14px;min-height:34px;font-size:14px}
button.x:hover,button.x:focus-visible{color:var(--bad);border-color:var(--bad)}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mut{color:var(--mut);font-size:14px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--raised);border-radius:4px}

/* pill bar (auth + app) */
.pillbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px 8px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(16,32,28,.72);margin-top:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.langSel{width:auto;padding:8px 14px;border-radius:999px;min-height:40px}

/* auth */
#auth{min-height:100vh;padding:0 20px 40px;max-width:1240px;margin:0 auto}
.authgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;padding:56px 0 24px}
.hero-side{display:flex;flex-direction:column;gap:28px}
.hero-side h2{font-size:clamp(40px,6vw,84px);font-weight:750;letter-spacing:-.05em;line-height:.98;margin:0}
.hero-side h2 em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.08em;letter-spacing:-.02em;color:var(--ac)}
.hero-side p{color:var(--mut);margin:0;max-width:470px;font-size:17px}
.hero-side ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.hero-side li{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:13px;letter-spacing:.04em}
.hero-side li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
.form-side .card{width:100%;max-width:460px;margin-left:auto;padding:30px;border-radius:28px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--raised);border-radius:999px;margin-bottom:22px}
.tabs button{border:0;background:transparent;color:var(--mut);width:100%}
.tabs button[aria-selected=true]{background:#0e1f1b;color:#e6f2ee}
#aerr{color:#b3261e;margin:0;min-height:22px;font-size:14px}
@media(max-width:900px){.authgrid{grid-template-columns:1fr;gap:32px;padding-top:36px}.form-side .card{margin:0 auto}}

/* app */
.titlerow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin:44px 0 24px}
.titlerow input{width:auto;border-radius:999px}
.chip{display:flex;gap:10px;align-items:center;padding:3px 14px 3px 3px;border:1px solid var(--line);border-radius:999px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--on-ac);font-weight:700;font-size:14px;display:grid;place-items:center}
.chip b{display:block;font-size:14px;font-weight:600;line-height:1.2}.chip span{font-size:12px;color:var(--mut)}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
#stats .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
#stats .stat:first-child{background:#eaf3ef;color:#0e1f1b;border-color:#eaf3ef}
#stats .stat:first-child span{color:#4d6a62}
.stat span{display:block;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.035em;margin-top:6px;line-height:1.1}
#stats .stat:first-child b{border-bottom:2px dashed var(--ac);padding-bottom:10px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
.workspace{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;margin-top:16px;align-items:start}
.workspace>div{display:grid;gap:16px;min-width:0}
@media(max-width:900px){.workspace{grid-template-columns:1fr}}
.bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%}
.item{margin-bottom:16px}
.item>div{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--c) 20%,transparent)}
.ftools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.ftools input,.ftools select{flex:1;min-width:130px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);color:var(--mut);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
td.n,th.n{text-align:right}td.d{white-space:normal}td.n{font-weight:600}
td.act{text-align:right}td.act button+button{margin-left:20px}
tbody tr:hover{background:var(--raised)}
.over{color:var(--bad);font-weight:700}
.months{display:flex;align-items:flex-end;gap:12px;height:140px}
.months div{flex:1;text-align:center;font-family:var(--mono);font-size:12px;color:var(--mut)}
.months i{display:block;width:100%;max-width:38px;margin:0 auto 6px;background:var(--raised);border-radius:8px}
.months .now i{background:var(--ac)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9;color:#0a1412}
#toast.on{opacity:1;transform:translateX(-50%)}
#langSuggest{width:100%;margin-top:4px;padding:6px;font-size:14px;color:#c4472a;min-height:36px}
.clsbox{border:1px solid;border-radius:var(--r-sm);padding:16px 18px;margin-bottom:16px}.clsbox b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}.clsbox ul{margin:10px 0;padding-left:20px}.clsbox li{margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


/* ===== landing v2: hareketli ===== */
html{scroll-behavior:smooth}
html.modal-open{overflow:hidden}
#auth{position:relative}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#auth>*:not(#bg):not(#authModal){position:relative;z-index:1}
.sp{position:fixed!important;top:0;left:0;height:3px;width:0;background:var(--ac);z-index:70!important}
.pillbar.nav{position:sticky;top:12px;z-index:20;background:#10201cee;transition:padding .25s,transform .25s}
.pillbar.nav.small{padding-top:4px;padding-bottom:4px}
.navlinks{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--raised)}
.navlinks a{color:var(--mut);text-decoration:none;font-weight:500;font-size:14.5px;padding:8px 16px;border-radius:999px;transition:color .15s,background .15s}
.navlinks a:hover{color:var(--tx);background:rgba(230,242,238,.08)}
@media(max-width:860px){.navlinks{display:none}}
.pillbar.nav button.cta{width:auto}
.landing-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:64px 0 32px}
@media(max-width:900px){.landing-hero{grid-template-columns:1fr;padding-top:36px}}
.hero-text{display:flex;flex-direction:column;gap:24px}
.hero-text h2{font-size:clamp(42px,6.2vw,88px);font-weight:750;letter-spacing:-.05em;line-height:.97;margin:0}
.hero-text h2 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.hero-text h2 .w>span{display:inline-block;transform:translateY(105%);animation:wup .9s calc(var(--i)*.07s + .1s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wup{to{transform:none}}
.hero-text h2 em,.hero-text h2 .w.em>span{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.08em;letter-spacing:-.02em;color:var(--ac)}
.hero-text .lead{color:var(--mut);margin:0;max-width:480px;font-size:17.5px}
.typed{margin:0;font:500 15px var(--mono);letter-spacing:.04em;color:var(--mut)}
.typed b{color:var(--tx);font-weight:500}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ac);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.cta-row button{width:auto;padding:12px 28px;font-size:16px}
button.outline{background:transparent}
.mag{transition:transform .2s ease-out,background .15s,border-color .15s}
/* stage */
.stage{position:relative;display:grid;place-items:center;min-height:620px;perspective:1100px}
.phone-wrap{transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .15s ease-out;transform-style:preserve-3d}
.phone{width:290px;height:580px;border:10px solid #1d2f2a;border-radius:46px;background:#eaf3ef;color:#0e1f1b;position:relative;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);animation:float 6s ease-in-out infinite}
.notch{position:absolute;top:10px;left:50%;width:88px;height:24px;margin-left:-44px;background:#0a1412;border-radius:99px;z-index:2}
.screen{padding:44px 18px 18px;display:flex;flex-direction:column;gap:12px;height:100%}
.scr-time{font:500 12px var(--mono);margin:0;color:#4d6a62}
.scr-h{font:750 24px var(--display);letter-spacing:-.04em;margin:0}
.scr-card{background:#fff;border:1px solid #c6dcd3;border-radius:18px;padding:14px 16px}
.scr-k{display:block;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#4d6a62}
.scr-card b{display:block;font:700 28px var(--display);letter-spacing:-.04em;margin-top:2px;font-variant-numeric:tabular-nums}
.dash{display:block;border-bottom:2px dashed var(--ac);margin-top:8px}
.scr-seg{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;background:#dcebe5}
.scr-seg i{display:block;height:100%;background:var(--c);flex:var(--f,.0001) 1 0;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.scr-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;align-content:start;height:178px;overflow:hidden}
.scr-list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #c6dcd3;border-radius:14px;padding:10px 12px;font-size:13.5px;animation:slidein .55s cubic-bezier(.2,.8,.2,1) both}
.scr-list li.out{animation:slideout .4s ease-in forwards}
@keyframes slidein{from{opacity:0;transform:translateY(-22px) scale(.96)}}
@keyframes slideout{to{opacity:0;transform:translateX(30px)}}
.scr-list b{font-variant-numeric:tabular-nums}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c)}
.scr-coin{position:absolute;left:50%;bottom:16px;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:var(--ac);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.fcard{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:0 20px 40px rgba(0,0,0,.4);min-width:170px;transform:translate(var(--px,0px),var(--py,0px))}
.fcard .mono-k{display:block;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.fcard b{display:block;font:700 18px var(--display);letter-spacing:-.02em;margin-top:2px}
.fcard.f1{top:80px;right:-8px;animation:bob 5s ease-in-out infinite}
.fcard.f1.pop{animation:pop2 .5s cubic-bezier(.2,.8,.2,1),bob 5s .5s ease-in-out infinite}
@keyframes pop2{from{opacity:.2;scale:.85}}
.fcard.f2{bottom:96px;left:-14px;animation:bob 6s -2s ease-in-out infinite}
.fcard.f3{top:240px;left:-40px;min-width:150px;animation:bob 7s -4s ease-in-out infinite}
.fbar{display:block;height:6px;border-radius:3px;background:var(--raised);margin-top:8px;overflow:hidden}
.fbar i{display:block;height:100%;width:0;background:var(--ac);animation:fill 1.4s 1s ease-out forwards}
@keyframes fill{to{width:80%}}
.mini6{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:8px}
.mini6 i{flex:1;height:var(--h);background:var(--raised);border-radius:3px;transform-origin:bottom;animation:growy 1s cubic-bezier(.2,.8,.2,1) both}
.mini6 i:last-child{background:var(--ac)}
.mini6 i:nth-child(2){animation-delay:.1s}.mini6 i:nth-child(3){animation-delay:.2s}.mini6 i:nth-child(4){animation-delay:.3s}.mini6 i:nth-child(5){animation-delay:.4s}.mini6 i:nth-child(6){animation-delay:.5s}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes bob{50%{translate:0 -12px}}
@media(max-width:700px){.fcard.f3{display:none}.fcard.f1{right:0}.fcard.f2{left:0}}
/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);margin:18px -20px 0;padding:15px 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee+.marquee{border-top:0;margin-top:0}
.track{display:flex;width:max-content;animation:marq 38s linear infinite}
.marquee.rev .track{animation-direction:reverse;animation-duration:30s}
.track span{font:500 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:0 28px;position:relative;white-space:nowrap}
.track span::after{content:"";position:absolute;right:-3px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--ac)}
@keyframes marq{to{transform:translateX(-50%)}}
.marquee:hover .track{animation-play-state:paused}
/* stats */
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:56px 0 0}
.stats4 b{display:block;font:750 clamp(44px,6vw,76px)/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.stats4 span{display:block;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:6px}
/* sections */
.sec{padding:80px 0 8px}
.sec>h2,.trybox h2{font-size:clamp(30px,4.2vw,52px);letter-spacing:-.045em;line-height:1.02;font-weight:750;max-width:760px;margin-bottom:28px}
.lead2{max-width:560px;margin:-12px 0 24px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{overflow:hidden;position:relative;min-height:240px;display:flex;flex-direction:column;gap:6px}
.tile h3{font:700 22px var(--display);letter-spacing:-.03em;margin:0}
.tile p{margin:0;color:var(--mut)}
.t-big{grid-column:span 2;grid-row:span 2}
.t-wide{grid-column:span 2}
@media(max-width:900px){.bento{grid-template-columns:1fr 1fr}.t-big{grid-column:span 2}}
@media(max-width:560px){.bento{grid-template-columns:1fr}.t-big,.t-wide{grid-column:auto}}
.bars6{display:flex;align-items:flex-end;gap:12px;flex:1;min-height:150px;margin-top:18px}
.bars6 i{flex:1;height:var(--h);background:var(--raised);border-radius:10px 10px 4px 4px;transform:scaleY(0);transform-origin:bottom;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.bars6 i:last-child{background:var(--ac)}
.in .bars6 i{transform:none}
.in .bars6 i:nth-child(2){transition-delay:.1s}.in .bars6 i:nth-child(3){transition-delay:.2s}.in .bars6 i:nth-child(4){transition-delay:.3s}.in .bars6 i:nth-child(5){transition-delay:.4s}.in .bars6 i:nth-child(6){transition-delay:.5s}
.donut-mini{width:110px;height:110px;margin-top:auto;align-self:flex-end}
.donut-mini circle{fill:none;stroke-width:16;stroke-dasharray:0 100;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.in .donut-mini circle{stroke-dasharray:var(--l) 100;stroke-dashoffset:var(--o)}
.hello{margin-top:auto;font:italic 400 48px/1 var(--serif);color:var(--ac);overflow:hidden;height:56px}
.hello span{display:inline-block;animation:hin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes hin{from{transform:translateY(100%);opacity:0}}
.curtick{margin-top:auto;height:54px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.curtick div{display:flex;gap:26px;width:max-content;font:700 40px/54px var(--display);color:var(--ac);animation:marq 9s linear infinite}
.bands{display:flex;gap:4px;height:22px;margin-top:auto}
.bands i{display:block;border-radius:99px;background:var(--c);flex:0 1 0;transition:flex-grow 1.2s cubic-bezier(.2,.8,.2,1)}
.in .bands i{flex:var(--w) 1 0}
/* try it */
.try{display:grid;gap:18px;padding:28px;border-radius:28px}
.try-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:end}
@media(max-width:700px){.try-grid{grid-template-columns:1fr}}
.rng b{font:700 18px var(--display);color:#0e1f1b;margin-left:6px}
input[type=range]{padding:0;min-height:30px;accent-color:#e0603b;background:transparent;border:0}
.try-bands{position:relative;display:flex;gap:4px;height:26px;border-radius:99px;overflow:visible}
.try-bands>i{display:block;height:100%;background:var(--c);flex:var(--w) 1 0;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1);min-width:6px}
.try-bands>i:first-child{border-radius:99px 0 0 99px}.try-bands>i:nth-last-child(2){border-radius:0 99px 99px 0}
#tryMarker{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:#0e1f1b;border-radius:2px;transition:left .35s cubic-bezier(.2,.8,.2,1);left:0}
.try-out{display:grid;gap:6px}
.try-out b.cls{font:750 clamp(26px,4vw,40px) var(--display);letter-spacing:-.04em}
.try-out p{margin:0;color:#35524a}
.try .mut{color:#4d6a62}
/* pinned steps */
.pin{height:260vh;position:relative}
.pin-in{position:sticky;top:90px;padding-top:40px;min-height:70vh}
.pin-in h2{font-size:clamp(30px,4.2vw,52px);letter-spacing:-.045em;line-height:1.02;font-weight:750;margin:0 0 36px}
.pin-body{position:relative;height:260px}
.pstep{position:absolute;inset:0 auto auto 0;max-width:640px;opacity:0;transform:translateY(40px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.pstep.on{opacity:1;transform:none}
.pstep.past{opacity:0;transform:translateY(-40px)}
.pstep h3{font:700 clamp(26px,3.6vw,40px) var(--display);letter-spacing:-.04em;margin:0 0 10px}
.pstep p{margin:0;color:var(--mut);font-size:18px}
.stepno{display:block;font:italic 400 clamp(80px,12vw,150px)/1 var(--serif);color:var(--ac);margin-bottom:4px}
.pin-track{height:4px;background:var(--raised);border-radius:2px;overflow:hidden;max-width:640px}
.pin-track i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s linear}
.mono-hint{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 0}
.sec.final{margin-top:40px;padding:56px;display:grid;gap:14px;justify-items:start;border-radius:28px}
.sec.final h2{font-size:clamp(28px,4vw,48px);margin:0;max-width:640px;letter-spacing:-.045em;line-height:1.02;font-weight:750}
.sec.final p{margin:0;color:#35524a}

.rise{animation:rise .8s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
.js .rv{opacity:0;transform:translateY(32px);transition:opacity .7s var(--d,0s),transform .7s var(--d,0s) cubic-bezier(.2,.8,.2,1)}
.js .rv.in{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){.phone,.fcard,.track,.curtick div,.caret{animation:none}.hero-text h2 .w>span{transform:none;animation:none}.bars6 i{transform:none}.donut-mini circle{stroke-dasharray:var(--l) 100;stroke-dashoffset:var(--o)}.bands i{flex:var(--w) 1 0}.fbar i{width:80%;animation:none}.mini6 i{animation:none}}
/* auth modal */
#authModal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px}
#authModal .backdrop{position:absolute;inset:0;background:rgba(4,10,9,.75)}
#authModal .card{position:relative;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:30px;border-radius:28px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.closeX{position:absolute;top:14px;right:14px;width:38px;min-height:38px;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--raised);color:var(--tx)}
/* ===== app v2: hareket ===== */
#app .panel{animation:panelin .7s calc(var(--pi,0)*70ms) cubic-bezier(.2,.8,.2,1) both}
@keyframes panelin{from{opacity:0;transform:translateY(22px)}}
.bar i{transform-origin:left;animation:barx .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes barx{from{transform:scaleX(0)}}
.months i{transform-origin:bottom;animation:growy .9s calc(var(--i,0)*80ms) cubic-bezier(.2,.8,.2,1) both}
tbody.anim tr{animation:rowin .5s calc(var(--i,0)*45ms) cubic-bezier(.2,.8,.2,1) both}
@keyframes rowin{from{opacity:0;transform:translateX(-18px)}}
.row2b{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-top:16px;align-items:start}

.donutwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
#donut{width:170px;height:170px;flex:none}
#donut circle.sg{fill:none;stroke-width:15;stroke-dasharray:0 100;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
#donut text{fill:var(--tx);font:700 10.5px var(--display);text-anchor:middle;font-variant-numeric:tabular-nums}

function buildCountries() {
  const dn = new Intl.DisplayNames([lang], {type: 'region'}), out = [];
  for (const a of A_Z) for (const b of A_Z) {
    const c = a + b; if (NOT_COUNTRY.has(c)) continue;
    let n; try { n = dn.of(c); } catch { continue; }
    if (n && n !== c) out.push([c, n]);
  }
  out.sort((x, y) => x[1].localeCompare(y[1], lang));
  countries = lang === 'tr' ? [out.find(c => c[0] === 'TR'), ...out.filter(c => c[0] !== 'TR')] : out;
  const v = $('rcountry').value;
  $('rcountry').innerHTML = `<option value="">${esc(t('selCountry'))}</option>` + countries.map(([c, n]) => `<option value="${c}">${esc(n)}</option>`).join('');
  $('rcountry').value = v;
}

}

const unhex = h => Uint8Array.from(h.match(/../g), x => parseInt(x, 16));
async function hashPw(pw, saltHex) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: unhex(saltHex), iterations: 150000}, k, 256));
}

const USR = 1.158; // ABD TÜFE 2024/2021 (2025 henüz yok); PPP ile ABD fiyat düzeyine çevrilen geliri 2021 fiyatlarına indirmek için
const phi = x => { const t = 1 / (1 + 0.2316419 * Math.abs(x)), p = 0.3989423 * Math.exp(-x * x / 2) * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; };
const phiInv = p => { let lo = -8, hi = 8; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; phi(m) < p ? lo = m : hi = m; } return (lo + hi) / 2; };
const CLS = [['incExtreme', '#ff7b72'], ['incPoor', '#e3b341'], ['incLow', '#58a6ff'], ['cls3', '#7ee787'], ['cls4', '#56d4dd'], ['cls5', '#d2a8ff']];
// shortcut: log-normal model fitted to the share under $8.30/day and the Gini; real distributions have fatter top tails, so the upper classes are approximate
function classify(d, income, hh) {
  const x = income / hh / 30.4 / (d[8] * USR), sigma = Math.SQRT2 * phiInv((d[6] / 100 + 1) / 2);
  const m = Math.log(8.3) - sigma * phiInv(Math.min(Math.max(d[3], .1), 99.9) / 100);
  const q = phi((Math.log(x) - m) / sigma) * 100;
  return {x, q, c: x < 3 ? 0 : x < 4.2 ? 1 : x < 8.3 ? 2 : q < 75 ? 3 : q < 90 ? 4 : 5};
}

function renderIncome() {

  let h = title;
  if (!d) { el.innerHTML = h + `<p class="mut">${esc(t('incNone'))}</p>`; return; }
  const [y, p3, p42, p83, hu, top, gini, gni, ppp, py] = d, local = CUR[user.country];
  const l = [3, 4.2, 8.3].map(n => nf(n, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
  if (p3 != null && gini != null && top != null && ppp) {
    if (user.income > 0 && local !== user.cur) h += `<p class="mut">${esc(f('incNoCur', {cur: local}))}</p>`;
    else if (user.income > 0) {
      const r = classify(d, user.income, user.hh || 1), [name, color] = CLS[r.c];
      h += `<div class="clsbox" style="border-color:${color}"><b style="color:${color}">${esc(f('incYou', {c: t(name)}))}</b><ul>${[
        f('e1', {x: nf(r.x, {maximumFractionDigits: 2})}),
        f('e2', {pos: f('pos' + Math.min(r.c, 3), {a: l[0], b: l[1], c: l[2]})}),
        f('e3', {p: nf(p83), c: l[2]}),
        f('e4', {g: nf(gini), t: nf(top), q: nf(r.q, {maximumFractionDigits: 0})}),
        f('e5', {c: l[2], m: nf(8.3 * 30.4 * ppp * USR, {maximumFractionDigits: 0}), cur: local})
      ].map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="mut">${esc(f('incDisc', {y: py}))}</p></div>`;
    }
    h += `<form id="incForm" class="row" style="align-items:end;margin-bottom:14px"><label><span>${esc(t('incIncome'))}</span><input type="number" id="iinc" min="0" step="1" value="${user.income || ''}" required></label><label><span>${esc(t('incHH'))}</span><input type="number" id="ihh" min="1" step="1" value="${user.hh || 1}" required></label><button class="p" style="grid-column:1/-1">${esc(t('incCalc'))}</button></form>`;
  } else h += `<p class="mut">${esc(t('incNoCls'))}</p>`;
  if (p3 != null) {
    const seg = [[p3, '#ff7b72', t('incExtreme'), `< $${l[0]}`], [p42 - p3, '#e3b341', t('incPoor'), `$${l[0]} – ${l[1]}`], [p83 - p42, '#58a6ff', t('incLow'), `$${l[1]} – ${l[2]}`], [100 - p83, '#7ee787', t('incUp'), `> $${l[2]}`]].map(x => [Math.max(x[0], 0), ...x.slice(1)]);
    h += `<div style="display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:12px">${seg.map(x => `<i style="width:${x[0]}%;background:${x[1]}"></i>`).join('')}</div>
      <div class="grid g4" style="margin-bottom:14px">${seg.map(x => `<div><i class="dot" style="background:${x[1]}"></i><b>${esc(x[2])}</b><br><span class="mut">${esc(x[3])} · ${nf(x[0])}%</span></div>`).join('')}</div>`;
  }
  const m = [[hu, 'incHunger', n => nf(n) + '%'], [top, 'incTop', n => nf(n) + '%'], [gini, 'incGini', nf], [gni, 'incGni', n => nf(n, {style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0})]].filter(x => x[0] != null);
  if (!m.length && p3 == null) { el.innerHTML = title + `<p class="mut">${esc(t('incNone'))}</p>`; return; }
  h += `<div class="grid g4">${m.map(x => `<div class="stat"><span>${esc(t(x[1]))}</span><b>${x[2](x[0])}</b></div>`).join('')}</div>`;
  if (y) h += `<p class="mut" style="margin:12px 0 0">${esc(t('incSrc').replace('{y}', y))}</p>`;
  el.innerHTML = h;
}

  $('stats').innerHTML = [
    [t('mTotal'), TL(total)], [t('count'), mo.length],

  ].map(([l, v], i) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`).join('');

    <td><span class="pill" style="--c:${c.color}">${esc(c.name)}</span></td><td>${esc(t('pay_' + e.pay))}</td>

    <td class="act"><button data-edit="${e.id}">${esc(t('edit'))}</button><button class="x" data-del="${e.id}">${esc(t('del'))}</button></td></tr>`; }).join('')
    || `<tr><td colspan="6" class="mut">${esc(t('none'))}</td></tr>`;
  const sig = rows.map(e => e.id).join(); $('rows').classList.toggle('anim', sig !== renderSig); renderSig = sig;
  $('rows').querySelectorAll('tr').forEach((tr, i) => tr.style.setProperty('--i', i));

const REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;
const fmtT = (k, o = {}) => t(k).replace(/\{(\w+)\}/g, (_, n) => o[n]);
const nfx = (n, o) => n.toLocaleString(LOC(), {maximumFractionDigits: 1, ...o});
const rafTween = (from, to, ms, set, done) => {
  if (REDUCE || from === to) { set(to); done && done(); return; }
  const t0 = performance.now();
  const tick = now => { const k = Math.min((now - t0) / ms, 1); set(from + (to - from) * (1 - Math.pow(1 - k, 3))); k < 1 ? requestAnimationFrame(tick) : done && done(); };
  requestAnimationFrame(tick);
};

let typedRun = 0;
function restartTyped() {
  const el = $('typed'), id = ++typedRun, words = ['cat_rent', 'cat_groceries', 'cat_bills', 'cat_transport', 'cat_dining'].map(t);
  if (REDUCE) { el.textContent = words[0]; return; }
  let w = 0, c = 0, del = false;
  const step = () => {
    if (id !== typedRun) return;
    const word = words[w];
    el.textContent = word.slice(0, c);
    if (!del && c === word.length) { del = true; return setTimeout(step, 1400); }
    if (del && c === 0) { del = false; w = (w + 1) % words.length; return setTimeout(step, 300); }
    c += del ? -1 : 1; setTimeout(step, del ? 45 : 90);
  };
  step();
}

/* arka plan: sürüklenen noktalar */
{
  const cv = $('bg'), cx = cv.getContext('2d'); let W, H, pts = [];
  const mouse = {x: -999, y: -999};
  const size = () => {
    const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    pts = Array.from({length: Math.round(Math.min(90, W * H / 22000))}, () => ({x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35, r: 1.2 + Math.random() * 2}));
  };
  const draw = () => {
    cx.clearRect(0, 0, W, H);
    for (const p of pts) {
      if (!REDUCE) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < 14000) { const f = (1 - d2 / 14000) * .9; p.x += dx / Math.sqrt(d2 || 1) * f; p.y += dy / Math.sqrt(d2 || 1) * f; }
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
      }
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fillStyle = 'rgba(255,143,107,.55)'; cx.fill();
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 120) { cx.strokeStyle = `rgba(230,242,238,${.1 * (1 - d / 120)})`; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
    }
  };
  const loop = () => { if ($('auth').hidden) return; draw(); requestAnimationFrame(loop); };
  size(); addEventListener('resize', () => { size(); if (REDUCE) draw(); });
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  REDUCE ? draw() : loop();
}

{

  const setTotal = () => { const to = Object.values(sum).reduce((a, b) => a + b, 0); rafTween(shown, to, 700, n => total.textContent = money(n), () => shown = to); };
  seg.innerHTML = Object.keys(COL).map(k => `<i data-k="${k}" style="--c:${COL[k]}"></i>`).join('');
  const reset = () => {

    rows = [['bills', 820], ['groceries', 4650.5], ['rent', 15000]];

  window.demoRefresh = () => { list.innerHTML = rows.map(rowHtml).join(''); total.textContent = money(shown); };
  reset();
  setTimeout(() => { setSeg(); setTotal(); }, 700);
  if (!REDUCE) setInterval(() => {
    if ($('auth').hidden || document.hidden) return;
    if (step >= NEXT.length) { reset(); setSeg(); setTotal(); return; }
    const [k, a] = NEXT[step++]; sum[k] += a; rows.unshift([k, a]); rows.length = 3;
    const last = list.lastElementChild; if (last) { last.classList.add('out'); setTimeout(() => last.remove(), 380); }
    list.insertAdjacentHTML('afterbegin', rowHtml([k, a]));

    fc.textContent = `${t('cat_' + k)} · ${money(a)}`;
    const card = fc.parentElement; card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  }, 2800);

/* kendin dene: ülkene göre sınıf */
function classX(d, x) {
  const sigma = Math.SQRT2 * phiInv((d[6] / 100 + 1) / 2), m = Math.log(8.3) - sigma * phiInv(Math.min(Math.max(d[3], .1), 99.9) / 100);
  const q = phi((Math.log(x) - m) / sigma) * 100;
  return {q, c: x < 3 ? 0 : x < 4.2 ? 1 : x < 8.3 ? 2 : q < 75 ? 3 : q < 90 ? 4 : 5};
}
function tryInit() {
  const sel = $('tryCountry'), keep = sel.value || 'TR';
  const codes = Object.keys(INC).filter(c => INC[c][1] != null && INC[c][6] != null && INC[c][8]).sort((a, b) => countryName(a).localeCompare(countryName(b), lang));
  sel.innerHTML = codes.map(c => `<option value="${c}">${esc(countryName(c))}</option>`).join('');
  sel.value = codes.includes(keep) ? keep : codes[0]; tryRender();
}
function tryRender() {
  const c = $('tryCountry').value, d = INC[c]; if (!d) return;
  const x = .5 * Math.pow(400, +$('trySlider').value / 100), [, p3, p42, p83, , top, gini, , ppp] = d, r = classX(d, x);
  const seg = [[p3, '#ff7b72'], [p42 - p3, '#e3b341'], [p83 - p42, '#58a6ff'], [100 - p83, '#7ee787']];
  const bands = $('tryBands'), mk = $('tryMarker');
  if (!bands.querySelector('i')) seg.forEach(() => bands.insertBefore(document.createElement('i'), mk));
  bands.querySelectorAll(':scope>i').forEach((el, i) => { el.style.setProperty('--w', Math.max(seg[i][0], 0.8)); el.style.setProperty('--c', seg[i][1]); });
  const pos = x < 3 ? p3 * x / 3 : x < 4.2 ? p3 + (p42 - p3) * (x - 3) / 1.2 : x < 8.3 ? p42 + (p83 - p42) * (x - 4.2) / 4.1 : Math.max(r.q, p83);
  mk.style.left = Math.min(Math.max(pos, 0), 99.5) + '%';
  $('tryX').textContent = '$' + nfx(x, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const [name, color] = CLS[r.c], monthly = nfx(x * 30.4 * ppp * USR, {maximumFractionDigits: 0}) + ' ' + (CUR[c] || '');
  $('tryOut').innerHTML = `<b class="cls"><i class="dot" style="background:${color}"></i>${esc(t(name))}</b>
    <p>${esc(t('tryMonthly'))}: <b>${esc(monthly)}</b></p>
    <p>${esc(fmtT('e4', {g: nfx(gini), t: nfx(top), q: nfx(Math.min(r.q, 99.9), {maximumFractionDigits: 0})}))}</p>`;
}
$('tryCountry').onchange = tryRender; $('trySlider').oninput = tryRender;

/* kaydırma: ilerleme çubuğu, çubuk küçülmesi, sabitlenen adımlar */
{
  const pin = $('nasil'); let ticking = false;
  const update = () => {
    ticking = false;
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
    $('sp').style.width = (max > 0 ? y / max * 100 : 0) + '%';
    $('nav').classList.toggle('small', y > 60);
    const r = pin.getBoundingClientRect(), total = pin.offsetHeight - innerHeight * .7;
    const p = Math.min(1, Math.max(0, (-r.top + 90) / total)), idx = Math.min(2, Math.floor(p * 3));
    pin.querySelectorAll('.pstep').forEach((s, i) => { s.classList.toggle('on', i === idx); s.classList.toggle('past', i < idx); });
    $('pinBar').style.width = (p * 100) + '%';
  };
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, {passive: true});
  addEventListener('resize', update); update();
}

/* ---- uygulama ekranı: halka grafik, gün ısı haritası, sayaç animasyonu ---- */
let lastStat = [0, 0, 0], renderSig = '';
function renderViz(mo, total, days) {
  const bs = document.querySelectorAll('#stats .stat b');
  [total, mo.length, total / days].forEach((v, i) => { const b = bs[i]; if (!b) return; const f = i === 1 ? n => String(Math.round(n)) : TL; rafTween(lastStat[i], v, 800, n => b.textContent = f(n)); lastStat[i] = v; });
  const parts = S.cats.map(c => [c, sum(mo.filter(e => e.cat === c.id))]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  let cum = 0;
  $('donut').innerHTML = `<g transform="rotate(-90 60 60)"><circle cx="60" cy="60" r="44" fill="none" stroke="var(--raised)" stroke-width="15"/>${parts.map(([c, v]) => { const l = v / total * 100, o = -cum; cum += l; return `<circle class="sg" cx="60" cy="60" r="44" pathLength="100" stroke="${c.color}" data-l="${Math.max(l - .8, .2)}" data-o="${o}"/>`; }).join('')}</g><text class="k" x="60" y="54">${esc(t('mTotal')).toUpperCase()}</text><text x="60" y="70">${total ? esc(TL(total)) : '—'}</text>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $('donut').querySelectorAll('circle.sg').forEach(c => { c.style.strokeDasharray = c.dataset.l + ' 100'; c.style.strokeDashoffset = c.dataset.o; })));
  $('donutLegend').innerHTML = parts.map(([c, v]) => `<li><span><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</span><b class="amt">${(v / total * 100).toFixed(0)}%</b></li>`).join('') || `<li class="mut">${esc(t('none'))}</li>`;
  const [y, m] = $('month').value.split('-').map(Number), dim = new Date(y, m, 0).getDate(), off = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const per = Array.from({length: dim}, (_, i) => sum(mo.filter(e => e.date === `${$('month').value}-${String(i + 1).padStart(2, '0')}`))), mx = Math.max(...per, 1);
  $('heat').innerHTML = '<i class="e"></i>'.repeat(off) + per.map((v, i) => { const day = `${$('month').value}-${String(i + 1).padStart(2, '0')}`; return `<i class="${v ? 'v' : ''}" data-day="${day}" role="button" tabindex="0" style="--i:${i};--p:${Math.round(28 + 62 * v / mx)}%" title="${esc(TL(v))}" aria-label="${esc(fmtDate(day))}: ${esc(TL(v))}">${i + 1}</i>`; }).join('');
  showDay();
}
/* takvimde bir güne basınca o günün giderleri */
let selDay = '';
function showDay() {
  const box = $('dayDetail'), month = $('month').value;
  document.querySelectorAll('#heat i[data-day]').forEach(i => i.classList.toggle('sel', i.dataset.day === selDay));
  if (!selDay || !selDay.startsWith(month)) { box.innerHTML = `<p class="mut">${esc(t('dayHint'))}</p>`; return; }
  const es = S.exp.filter(e => e.date === selDay);
  box.innerHTML = `<div class="dayhead"><b>${esc(fmtDate(selDay))}</b><b class="amt">${TL(sum(es))}</b></div>` + (es.length
    ? es.map(e => { const c = catOf(e.cat); return `<div class="dayrow"><span class="pill" style="--c:${c.color}">${esc(c.name)}</span><span class="dd">${esc(e.desc)}</span><b class="amt">${TL(e.amount)}</b></div>`; }).join('')
    : `<p class="mut">${esc(t('dayNone'))}</p>`);
}
const pickDay = ev => { const c = ev.target.closest('[data-day]'); if (!c) return; selDay = c.dataset.day; showDay(); };
$('heat').addEventListener('click', pickDay);
$('heat').addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickDay(ev); } });
