<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Kese: kişisel gider defteri">
  <defs>
    <pattern id="g" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#e6f2ee" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="#0a1412"/>
  <rect width="1280" height="360" fill="url(#g)"/>
  <circle cx="1080" cy="40" r="260" fill="#ff8f6b" fill-opacity=".08"/>

  <!-- logo -->
  <g transform="translate(84 84) scale(3)">
    <rect width="48" height="48" rx="14" fill="#ff8f6b"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#2a0f06" stroke-width="2.6"/>
    <path d="M18.5 31v-5M24 31v-9M29.5 31v-13" stroke="#2a0f06" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- başlık -->
  <text x="262" y="186" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="124" font-weight="800" letter-spacing="-5" fill="#e6f2ee">Kese</text>
  <text x="266" y="238" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" fill="#93aea6">Kişisel gider defteri. Tarayıcıda çalışır, kurulum yok.</text>

  <!-- etiketler -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="20" fill="#e6f2ee">
    <rect x="266" y="270" width="132" height="42" rx="21" fill="none" stroke="#e6f2ee" stroke-opacity=".25"/>
    <text x="332" y="297" text-anchor="middle">6 dil</text>
    <rect x="412" y="270" width="318" height="42" rx="21" fill="none" stroke="#e6f2ee" stroke-opacity=".25"/>
    <text x="571" y="297" text-anchor="middle">171 ülkede gelir sınıfı</text>
    <rect x="744" y="270" width="226" height="42" rx="21" fill="none" stroke="#e6f2ee" stroke-opacity=".25"/>
    <text x="857" y="297" text-anchor="middle">tek dosya</text>
  </g>

  <!-- süs: 6 aylık çubuklar -->
  <g transform="translate(1030 90)">
    <rect x="0"   y="132" width="26" height="48"  rx="6" fill="#17302a"/>
    <rect x="42"  y="104" width="26" height="76"  rx="6" fill="#17302a"/>
    <rect x="84"  y="118" width="26" height="62"  rx="6" fill="#17302a"/>
    <rect x="126" y="78"  width="26" height="102" rx="6" fill="#17302a"/>
    <rect x="168" y="94"  width="26" height="86"  rx="6" fill="#17302a"/>
    <rect x="210" y="30"  width="26" height="150" rx="6" fill="#ff8f6b"/>
  </g>
</svg>
